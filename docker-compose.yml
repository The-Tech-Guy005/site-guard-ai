version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siteguard_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the local data folder into the container to persist input videos and safety reports
      - ./data:/app/data
    environment:
      - PORT=8000
      - PPE_MODEL_PATH=ppe_yolo11n.pt
      - PPE_CONF_THRESHOLD=0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
